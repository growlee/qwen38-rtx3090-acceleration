name: ai-server-unsloth-qwen-bridge

# Source-only candidate. Promotion must pin PYTHON_IMAGE to an immutable digest
# already present on Server A and must verify the existing ai-server-control
# network and caller-key path before creating this service.
services:
  qwen-bridge:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: ai-server-unsloth-qwen-bridge:2026-08-29-candidate1
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      network: none
      args:
        PYTHON_IMAGE: ${QWEN_BRIDGE_PYTHON_IMAGE:?pin an immutable local Python image digest}
    container_name: ai-server-unsloth-qwen-bridge
    restart: unless-stopped
    user: "65532:65532"
    environment:
      QWEN_BRIDGE_LISTEN_HOST: 0.0.0.0
      QWEN_BRIDGE_LISTEN_PORT: "8000"
      QWEN_BRIDGE_UPSTREAM_HOST: gateway
      QWEN_BRIDGE_UPSTREAM_PORT: "8000"
      QWEN_BRIDGE_CALLER_KEY_FILE: <redacted-secret-path>
      QWEN_BRIDGE_CONNECT_TIMEOUT_SECONDS: "10"
      QWEN_BRIDGE_READ_TIMEOUT_SECONDS: "1860"
      QWEN_BRIDGE_MAX_REQUEST_BODY: "2097152"
    secrets:
      - source: qwen_gateway_caller_key
        target: qwen-gateway-caller-key
    networks:
      ai-control:
        ipv4_address: 172.21.250.80
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    init: true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 64m
    stop_grace_period: 35s
    healthcheck:
      test:
        - CMD
        - python
        - -B
        - /app/healthcheck.py
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s

networks:
  ai-control:
    external: true
    name: ai-server-control

secrets:
  qwen_gateway_caller_key:
    file: ${QWEN_GATEWAY_CALLER_KEY_FILE:?set the existing gateway caller-key path}
