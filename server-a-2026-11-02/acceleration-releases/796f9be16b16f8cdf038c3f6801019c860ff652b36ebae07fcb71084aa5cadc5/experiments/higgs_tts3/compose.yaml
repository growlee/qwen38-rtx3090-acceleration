services:
  higgs-tts3:
    profiles:
      - manual
    image: lmsysorg/sglang-omni@sha256:46235435997d1fa93fc81fb1c2d5b7fd8470d77395a5c348c0176094ffddf95e
    pull_policy: never
    user: "0:0"
    container_name: ai-exp-higgs-tts3
    restart: "no"
    init: true
    ipc: private
    shm_size: 4gb
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:18095:8000
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /runtime-cache/huggingface
      XDG_CACHE_HOME: /runtime-cache
      TRITON_CACHE_DIR: /runtime-cache
      FLASHINFER_WORKSPACE_BASE: /runtime-cache
      PYTHONUNBUFFERED: "1"
    volumes:
      - /srv/ai-server/staging/experiments/higgs-tts3/7556c17e05201fccd9c8cc120bc216dcc7b5d561/model:/models/higgs-tts-3-4b:ro
      - ./higgs-3090.yaml:/config/higgs-3090.yaml:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
      - /run:rw,nosuid,nodev,size=16m
      - /runtime-cache:rw,nosuid,nodev,size=2g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - >-
        source /opt/omni/bin/activate &&
        exec python -m sglang_omni.cli serve
        --config /config/higgs-3090.yaml
        --host 0.0.0.0
        --port 8000
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8000/health
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10m
